name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths-ignore: 
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ecommerce-devops-project
            git pull
            docker compose down
            docker compose up -d --build
# force trigger
